name: CineGest CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  sqlite:
    name: SQLite validation
    runs-on: ubuntu-latest
    env:
      DATABASE_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Tests
        run: python manage.py test

      - name: Collect static files
        run: python manage.py collectstatic --noinput

  sqlserver:
    name: SQL Server 2022 integration
    runs-on: ubuntu-22.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CineGest_CI_2026_Strong!"
        ports:
          - 1433:1433

    env:
      DATABASE_ENGINE: sqlserver
      DB_NAME: CineGestDb
      DB_USER: sa
      DB_PASSWORD: "CineGest_CI_2026_Strong!"
      DB_HOST: 127.0.0.1
      DB_PORT: 1433
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_EXTRA_PARAMS: TrustServerCertificate=yes;Encrypt=yes
      DJANGO_SECRET_KEY: cinegest-ci-production-validation-secret-key-2026
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Wait for SQL Server
        run: python scripts/wait_for_db.py

      - name: Verify migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations on SQL Server
        run: python manage.py migrate --noinput

      - name: Django system check on SQL Server
        run: python manage.py check

      - name: Tests on SQL Server
        run: python manage.py test

      - name: Production deployment checks
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy
