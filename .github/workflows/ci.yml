name: CineGest CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate migrations for validation
        run: python manage.py makemigrations --noinput

      - name: Show generated migrations
        run: |
          find apps -path "*/migrations/*.py" -type f ! -name "__init__.py" -print
          for file in $(find apps -path "*/migrations/*.py" -type f ! -name "__init__.py"); do
            echo "===== $file ====="
            cat "$file"
          done

      - name: Upload generated migrations
        uses: actions/upload-artifact@v4
        with:
          name: django-migrations
          path: apps/**/migrations/*.py

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Tests
        run: python manage.py test

      - name: Collect static files
        run: python manage.py collectstatic --noinput
