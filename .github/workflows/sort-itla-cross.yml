name: Sort ITLA cross-reference

on:
  push:
    branches:
      - 'docs/itla-unapec-cross'
    paths:
      - '.github/workflows/sort-itla-cross.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/itla-unapec-cross
      - name: Sort ITLA cross-reference
        run: python .github/scripts/sort-itla-cross.py
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sort ITLA cross-reference by matrícula"
          git push origin HEAD:docs/itla-unapec-cross
