<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CineGest{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'dashboard:index' %}">🎬 CineGest</a>
    {% if user.is_authenticated %}
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="{% url 'rentas:lista' %}">Rentas</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'reportes:index' %}">Reportes</a>
      <a class="btn btn-warning btn-sm" href="/admin/">Administración</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
