<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | CineGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4">
            <h1 class="h3 text-center">CineGest</h1>
            <p class="text-secondary text-center mb-4">Acceso al sistema</p>
            {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                    {{ form.username }}
                </div>
                <div class="mb-4">
                    <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                    {{ form.password }}
                </div>
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
